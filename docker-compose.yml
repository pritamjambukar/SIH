version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: paimana_postgres
    restart: always
    environment:
      POSTGRES_USER: paimana
      POSTGRES_PASSWORD: paimana_secret
      POSTGRES_DB: paimana_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paimana -d paimana_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
